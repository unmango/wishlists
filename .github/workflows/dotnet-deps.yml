name: .NET deps

on:
  pull_request:
    paths:
      - global.json
      - src/*/*.csproj
      - src/*/packages.lock.json
      - test/*/*.csproj
      - test/*/packages.lock.json

permissions:
  contents: read

concurrency:
  group: dotnet-deps-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # A push made with GITHUB_TOKEN wouldn't trigger CI on the new commit,
      # so push with the release App's token instead.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: unmango/actions/setup-nix@e8bbcbd12a2c521c5cb36957c00a7a8f4fe2e766 # v2.0.0
        with:
          github_access_token: ${{ github.token }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Sync .NET version, lock files and nix-deps.json
        run: ./hack/sync-dotnet.sh

      - name: Push changes
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if git diff --quiet; then
            echo "Everything is up to date"
            exit 0
          fi
          user_id=$(curl -fsS "https://api.github.com/users/${APP_SLUG}%5Bbot%5D" | jq -r .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -am "deps: sync .NET version, lock files and nix-deps.json"
          git push
