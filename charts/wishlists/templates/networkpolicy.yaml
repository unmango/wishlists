{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "wishlists.fullname" . }}
  labels:
    {{- include "wishlists.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "wishlists.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The public internet only: Google sign-in and item links for thumbnails.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- with .Values.networkPolicy.excludedCidrs }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- if .Values.networkPolicy.ipv6 }}
        - ipBlock:
            cidr: ::/0
            {{- with .Values.networkPolicy.excludedCidrsV6 }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
